<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin Wheel Embed – free spin the wheel for any website</title>
<meta name="description" content="Embed a free, provably fair spin the wheel on any website with one line of HTML. Name picker, yes or no wheel, team generator and more.">
<link rel="canonical" href="https://spinthewheelrandom.github.io/spin-wheel-embed/">
<style>
  :root{--teal:#14b8a6}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:960px;margin:0 auto;padding:24px 16px;background:#0b1220;color:#e5e7eb}
  a{color:#5eead4}
  h1{font-size:clamp(28px,5vw,44px);margin:8px 0}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  .tabs button{background:#111827;color:#e5e7eb;border:1px solid #374151;border-radius:999px;padding:8px 16px;font-size:15px;cursor:pointer}
  .tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
  iframe{width:100%;height:680px;border:0;border-radius:16px;background:#111827}
  @media (max-width:600px){iframe{height:820px}}
  pre{background:#111827;border:1px solid #374151;border-radius:12px;padding:16px;overflow:auto;font-size:13px;white-space:pre-wrap;word-break:break-all}
  .copy{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
</style>
</head>
<body>
<h1>🎡 Spin Wheel Embed</h1>
<p>Put a free spin the wheel on your website, blog or LMS. Pick a wheel, copy the code, paste it into your page.</p>
<div class="tabs" id="tabs"></div>
<iframe id="wheel" allow="fullscreen" loading="lazy" title="Spin the wheel"></iframe>
<h2>Embed code</h2>
<pre id="code"></pre>
<button class="copy" id="copy">Copy code</button>
<p>Want your own names? Make the wheel on <a href="https://spinthewheelrandom.com/">SpinTheWheelRandom.com</a> and use <b>Share / Embed</b>. Docs and examples: <a href="https://github.com/spinthewheelrandom/spin-wheel-embed">GitHub</a>.</p>
<script>
const W=[["Name Picker",""],["Yes or No","yes-or-no-wheel/"],["Number","random-number-wheel/"],["Letter","random-letter-wheel/"],["What to Eat","what-to-eat-wheel/"],["Truth or Dare","truth-or-dare-party-wheel/"],["Team Generator","random-team-generator/"]];
const tabs=document.getElementById('tabs'),f=document.getElementById('wheel'),code=document.getElementById('code');
function pick(i){const u="https://spinthewheelrandom.com/"+W[i][1];f.src=u;
 code.textContent=`<iframe src="${u}"\n  width="100%" height="680"\n  style="border:0;border-radius:16px;overflow:hidden;"\n  allow="fullscreen" loading="lazy"\n  title="${W[i][0]} wheel"></iframe>\n<p style="font-size:13px">Wheel by <a href="https://spinthewheelrandom.com/">SpinTheWheelRandom.com</a></p>`;
 [...tabs.children].forEach((b,j)=>b.classList.toggle('on',i===j));}
W.forEach((w,i)=>{const b=document.createElement('button');b.textContent=w[0];b.onclick=()=>pick(i);tabs.appendChild(b)});
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code.textContent);copy.textContent='Copied!'}catch(e){copy.textContent='Select and copy the code above'}setTimeout(()=>copy.textContent='Copy code',2000)};
pick(0);
</script>
</body>
</html>
